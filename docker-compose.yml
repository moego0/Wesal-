services:
  postgres:
    image: postgres:17-alpine
    container_name: wasal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wasal
      POSTGRES_PASSWORD: wasal_dev_password
      POSTGRES_DB: wasal
      # Arabic/Egyptian collation must be explicit; the default C collation
      # sorts Arabic names wrongly in patient lists.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - wasal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasal -d wasal"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wasal-redis
    restart: unless-stopped
    # noeviction is deliberate. BullMQ holds repeatable-job registrations in
    # Redis; under an LRU policy those keys are silently evicted under memory
    # pressure, every scheduled sweep disappears, and no reminders are sent
    # with nothing logged. See SweepHeartbeat for the watchdog.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - wasal_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  wasal_pgdata:
  wasal_redisdata:
